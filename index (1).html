<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grillade Le Goût · Kénitra — Livraison de grillades</title>
<style>
  :root{
    --brand-50:#fff7ed;--brand-100:#ffedd5;--brand-200:#fed7aa;--brand-300:#fdba74;
    --brand-400:#fb923c;--brand-500:#f97316;--brand-600:#ea580c;--brand-700:#c2410c;
    --brand-800:#9a3412;--brand-900:#7c2d12;
    --coal-700:#2b2724;--coal-800:#201d1b;--coal-900:#141211;
    --stone-50:#fafaf9;--stone-100:#f5f5f4;--stone-200:#e7e5e4;--stone-300:#d6d3d1;
    --stone-400:#a8a29e;--stone-500:#78716c;--stone-600:#57534e;--stone-700:#44403c;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--stone-50);color:var(--coal-900);font-family:"Segoe UI","Helvetica Neue",Arial,"Noto Sans Arabic",Tahoma,sans-serif;-webkit-font-smoothing:antialiased;}
  html[dir="rtl"] body{font-family:"Noto Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;}
  html[dir="rtl"]{direction:rtl;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;}
  img{max-width:100%;display:block;}
  .container{max-width:1152px;margin:0 auto;padding-inline:16px;}
  .no-scrollbar::-webkit-scrollbar{display:none;}
  .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .fade-up{animation:fadeUp .45s ease-out both;}
  @keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(249,115,22,.5);}70%{box-shadow:0 0 0 14px rgba(249,115,22,0);}100%{box-shadow:0 0 0 0 rgba(249,115,22,0);}}
  .pulse-ring{animation:pulseRing 2s infinite;}
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.4;}}
  .pulse-dot{animation:pulseDot 1.4s infinite;}

  /* ---------- Header ---------- */
  header.site-header{position:sticky;top:0;z-index:40;border-bottom:1px solid rgba(231,229,228,.8);background:rgba(255,255,255,.9);backdrop-filter:blur(8px);}
  .header-inner{display:flex;height:64px;align-items:center;gap:12px;}
  .brand-link{display:flex;align-items:center;gap:10px;}
  .brand-badge{display:grid;place-items:center;height:40px;width:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand-500),var(--brand-700));font-size:20px;box-shadow:0 4px 10px rgba(249,115,22,.3);}
  .brand-name{display:block;font-size:15px;font-weight:800;color:var(--coal-900);line-height:1.2;}
  .brand-city{display:block;font-size:11px;font-weight:700;color:var(--brand-600);}
  nav.main-nav{margin-inline:auto;display:none;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--stone-600);}
  @media(min-width:768px){nav.main-nav{display:flex;}}
  nav.main-nav a{border-radius:8px;padding:8px 12px;}
  nav.main-nav a:hover{background:var(--stone-100);}
  .header-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px;}
  @media(min-width:768px){.header-actions{margin-inline-start:0;}}
  .lang-switch{display:flex;align-items:center;border-radius:999px;border:1px solid var(--stone-300);background:#fff;padding:2px;font-size:12px;font-weight:800;box-shadow:0 1px 2px rgba(0,0,0,.05);}
  .lang-switch button{border-radius:999px;padding:6px 12px;transition:.15s;color:var(--stone-500);}
  .lang-switch button.active{background:var(--brand-500);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);}
  .cart-btn{position:relative;display:flex;align-items:center;gap:8px;border-radius:999px;background:var(--coal-900);padding:10px 16px;font-size:14px;font-weight:800;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.15);transition:.15s;}
  .cart-btn:hover{background:var(--coal-700);}
  .cart-btn .cart-label{display:none;}
  @media(min-width:640px){.cart-btn .cart-label{display:inline;}}
  .cart-badge{position:absolute;top:-6px;inset-inline-end:-6px;display:grid;place-items:center;height:20px;min-width:20px;border-radius:999px;background:var(--brand-500);padding:0 4px;font-size:11px;font-weight:800;color:#fff;box-shadow:0 0 0 2px #fff;}

  /* ---------- Hero ---------- */
  section.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 30% 20%,#3a2318,var(--coal-900) 60%);}
  .hero-inner{position:relative;max-width:1152px;margin:0 auto;padding:56px 16px 40px;}
  @media(min-width:640px){.hero-inner{padding-top:80px;}}
  .hero-content{max-width:640px;}
  .hero-badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:rgba(249,115,22,.2);padding:6px 12px;font-size:12px;font-weight:800;color:var(--brand-300);box-shadow:inset 0 0 0 1px rgba(249,115,22,.4);}
  .hero-title{margin:16px 0 0;font-size:38px;font-weight:900;line-height:1.1;color:#fff;}
  @media(min-width:640px){.hero-title{font-size:60px;}}
  .hero-sub{margin-top:16px;max-width:560px;font-size:16px;line-height:1.6;color:var(--stone-300);}
  .hero-buttons{margin-top:24px;display:flex;flex-wrap:wrap;gap:12px;}
  .btn-brand{border-radius:16px;background:var(--brand-500);padding:16px 28px;font-size:14px;font-weight:800;color:#fff;box-shadow:0 12px 24px rgba(249,115,22,.3);transition:.15s;}
  .btn-brand:hover{background:var(--brand-600);}
  .btn-ghost{border-radius:16px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);padding:16px 28px;font-size:14px;font-weight:800;color:#fff;backdrop-filter:blur(4px);transition:.15s;}
  .btn-ghost:hover{background:rgba(255,255,255,.2);}
  .hero-stats{margin-top:40px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(min-width:640px){.hero-stats{grid-template-columns:repeat(4,1fr);}}
  .hero-stat-card{border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.1);padding:16px;backdrop-filter:blur(4px);}
  .hero-stat-card p{margin:0;}
  .hero-stat-icon{font-size:20px;}
  .hero-stat-label{margin-top:4px;font-size:14px;font-weight:800;color:#fff;}
  .hero-stat-sub{font-size:11px;font-weight:700;color:var(--stone-400);}
  .hero-bar{position:relative;border-top:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.3);}
  .hero-bar-inner{max-width:1152px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;padding:12px 16px;font-size:12px;font-weight:700;color:var(--stone-300);}
  .open-now{display:inline-flex;align-items:center;gap:8px;color:#34d399;}
  .open-dot{height:8px;width:8px;border-radius:999px;background:#34d399;}
  .free-delivery-txt{color:var(--brand-300);}

  /* ---------- Menu browser ---------- */
  section.menu-section{max-width:1152px;margin:0 auto;padding-inline:16px;}
  .menu-searchbar{position:sticky;top:64px;z-index:30;margin-inline:-16px;background:rgba(250,250,249,.95);padding:16px 16px 12px;backdrop-filter:blur(6px);}
  .search-wrap{position:relative;}
  .search-icon{position:absolute;inset-inline-start:16px;top:0;bottom:0;display:flex;align-items:center;color:var(--stone-400);pointer-events:none;}
  .search-input{width:100%;border-radius:16px;border:1px solid var(--stone-200);background:#fff;padding:14px 16px 14px 44px;font-size:14px;font-weight:600;outline:none;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:.15s;}
  html[dir="rtl"] .search-input{padding:14px 44px 14px 16px;}
  .search-input:focus{border-color:var(--brand-400);box-shadow:0 0 0 4px var(--brand-100);}
  .cat-rail{margin-top:12px;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
  .cat-pill{flex-shrink:0;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:800;border:1px solid var(--stone-200);background:#fff;color:var(--stone-600);transition:.15s;white-space:nowrap;}
  .cat-pill:hover{border-color:var(--brand-300);}
  .cat-pill.active{background:var(--coal-900);color:#fff;border-color:var(--coal-900);box-shadow:0 4px 10px rgba(0,0,0,.15);}
  .section-title{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;color:var(--coal-900);margin:0;}
  .count-chip{margin-inline-start:4px;border-radius:999px;background:var(--stone-200);padding:2px 8px;font-size:11px;font-weight:800;color:var(--stone-600);}
  .menu-group{margin-top:40px;}
  .product-grid{margin-top:16px;display:grid;gap:16px;}
  @media(min-width:640px){.product-grid{grid-template-columns:1fr 1fr;}}
  .no-results{margin-top:48px;border-radius:24px;border:1px dashed var(--stone-300);background:#fff;padding:64px 16px;text-align:center;}
  .no-results p:first-child{font-size:36px;margin:0;}
  .no-results p:last-child{margin-top:12px;font-weight:800;color:var(--stone-600);}

  .product-card{display:flex;overflow:hidden;border-radius:24px;border:1px solid var(--stone-200);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:.2s;}
  .product-card:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(0,0,0,.08);}
  .product-card.unavailable{opacity:.6;}
  .product-info{display:flex;flex:1;flex-direction:column;justify-content:space-between;padding:16px;min-width:0;}
  .product-top{display:flex;align-items:flex-start;gap:8px;}
  .product-name{font-size:15px;font-weight:800;line-height:1.35;color:var(--coal-900);margin:0;}
  .popular-tag{flex-shrink:0;border-radius:999px;background:var(--brand-100);padding:2px 8px;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--brand-700);}
  .product-desc{margin:6px 0 0;font-size:12px;line-height:1.5;color:var(--stone-500);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .product-bottom{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .product-price{font-size:16px;font-weight:800;color:var(--brand-600);}
  .unavailable-tag{border-radius:999px;background:var(--stone-100);padding:6px 12px;font-size:12px;font-weight:800;color:var(--stone-500);}
  .add-btn{border-radius:999px;background:var(--coal-900);padding:8px 16px;font-size:12px;font-weight:800;color:#fff;transition:.15s;}
  .add-btn:hover{background:var(--brand-500);}
  .qty-stepper{display:flex;align-items:center;gap:4px;border-radius:999px;background:var(--stone-100);padding:4px;}
  .qty-btn{display:grid;place-items:center;height:28px;width:28px;border-radius:999px;background:#fff;font-weight:800;color:var(--stone-700);box-shadow:0 1px 2px rgba(0,0,0,.08);font-size:15px;}
  .qty-btn.plus{background:var(--brand-500);color:#fff;}
  .qty-val{width:20px;text-align:center;font-size:14px;font-weight:800;}
  .product-image{position:relative;width:110px;flex-shrink:0;background:var(--stone-100);display:grid;place-items:center;font-size:30px;}
  @media(min-width:640px){.product-image{width:128px;}}

  /* ---------- Cart drawer ---------- */
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(20,18,17,.5);backdrop-filter:blur(2px);}
  .cart-drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;z-index:50;display:flex;width:100%;max-width:420px;flex-direction:column;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.2);transform:translateX(100%);transition:transform .3s ease;}
  html[dir="rtl"] .cart-drawer{transform:translateX(-100%);}
  .cart-drawer.open{transform:translateX(0);}
  .cart-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--stone-200);padding:16px 20px;}
  .cart-head h2{margin:0;font-size:18px;font-weight:800;}
  .cart-head small{font-size:13px;font-weight:600;color:var(--stone-500);}
  .icon-btn{display:grid;place-items:center;height:36px;width:36px;border-radius:999px;background:var(--stone-100);color:var(--stone-600);font-size:15px;}
  .icon-btn:hover{background:var(--stone-200);}
  .cart-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 32px;text-align:center;}
  .cart-empty .emoji-big{font-size:60px;}
  .cart-body{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px;}
  .free-delivery-box{border-radius:16px;background:var(--brand-50);padding:12px;}
  .free-delivery-box p{margin:0;font-size:12px;font-weight:700;color:var(--brand-800);}
  .progress-track{margin-top:8px;height:6px;width:100%;overflow:hidden;border-radius:999px;background:var(--brand-200);}
  .progress-fill{height:100%;border-radius:999px;background:var(--brand-500);transition:width .3s;}
  .cart-item{display:flex;gap:12px;border-radius:16px;border:1px solid var(--stone-200);padding:12px;}
  .cart-item-img{height:64px;width:64px;flex-shrink:0;border-radius:12px;background:var(--stone-100);display:grid;place-items:center;font-size:22px;}
  .cart-item-info{min-width:0;flex:1;}
  .cart-item-name{margin:0;font-size:14px;font-weight:800;color:var(--coal-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cart-item-price{margin:2px 0 0;font-size:14px;font-weight:700;color:var(--brand-600);}
  .cart-item-actions{margin-top:8px;display:flex;align-items:center;gap:8px;}
  .remove-link{font-size:12px;font-weight:700;color:var(--stone-400);}
  .remove-link:hover{color:#ef4444;}
  .clear-cart-btn{width:100%;border-radius:12px;border:1px dashed var(--stone-300);padding:10px;font-size:12px;font-weight:700;color:var(--stone-500);}
  .clear-cart-btn:hover{border-color:#fca5a5;color:#ef4444;}
  .cart-footer{border-top:1px solid var(--stone-200);background:var(--stone-50);padding:16px 20px;display:flex;flex-direction:column;gap:10px;}
  .row-between{display:flex;justify-content:space-between;font-size:14px;color:var(--stone-600);}
  .row-total{display:flex;justify-content:space-between;border-top:1px solid var(--stone-200);padding-top:12px;font-size:16px;font-weight:800;color:var(--coal-900);}
  .min-order-warn{border-radius:12px;background:#fffbeb;padding:8px 12px;font-size:12px;font-weight:700;color:#b45309;margin:0;}
  .checkout-cta{width:100%;border-radius:16px;background:var(--brand-500);padding:16px;font-size:15px;font-weight:800;color:#fff;box-shadow:0 12px 24px rgba(249,115,22,.3);transition:.15s;}
  .checkout-cta:hover{background:var(--brand-600);}
  .checkout-cta:disabled{cursor:not-allowed;background:var(--stone-300);box-shadow:none;}

  /* ---------- Mobile cart bar ---------- */
  .mobile-cart-bar{position:fixed;inset-inline:0;bottom:0;z-index:40;padding:12px;}
  @media(min-width:768px){.mobile-cart-bar{display:none;}}
  .mobile-cart-btn{display:flex;width:100%;align-items:center;justify-content:space-between;border-radius:16px;background:var(--brand-500);padding:16px 20px;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.25);}
  .mobile-cart-btn .left{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;}
  .mobile-count{display:grid;place-items:center;height:24px;min-width:24px;border-radius:999px;background:rgba(255,255,255,.25);padding:0 4px;font-size:12px;}

  /* ---------- Footer ---------- */
  footer.site-footer{margin-top:64px;background:var(--coal-900);color:var(--stone-300);}
  .footer-grid{max-width:1152px;margin:0 auto;display:grid;gap:40px;padding:48px 16px;grid-template-columns:1fr;}
  @media(min-width:640px){.footer-grid{grid-template-columns:1fr 1fr;}}
  @media(min-width:1024px){.footer-grid{grid-template-columns:repeat(4,1fr);}}
  .footer-brand{display:flex;align-items:center;gap:10px;}
  .footer-brand span.name{font-size:18px;font-weight:800;color:#fff;}
  .footer-tagline{margin-top:16px;font-size:14px;line-height:1.6;color:var(--stone-400);}
  .footer-heading{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:#fff;margin:0;}
  .footer-list{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--stone-400);}
  .footer-list a:hover{color:var(--brand-400);}
  .open-pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:rgba(52,211,153,.15);padding:4px 12px;color:#34d399;width:fit-content;}
  .footer-bottom{border-top:1px solid rgba(255,255,255,.1);padding:20px 16px;text-align:center;font-size:12px;color:var(--stone-500);}

  /* ---------- Generic page bits ---------- */
  main.page-main{max-width:960px;margin:0 auto;padding:32px 16px;}
  main.page-main.wide{max-width:1152px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:var(--stone-500);}
  .back-link:hover{color:var(--brand-600);}
  .page-title{margin:12px 0 0;font-size:30px;font-weight:900;color:var(--coal-900);}
  .empty-state{margin-top:32px;border-radius:24px;border:1px dashed var(--stone-300);background:#fff;padding:64px 16px;text-align:center;}
  .empty-state p:first-child{font-size:48px;margin:0;}
  .empty-state p.msg{margin-top:12px;font-size:18px;font-weight:800;}
  .card{border-radius:24px;border:1px solid var(--stone-200);background:#fff;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .card h2{margin:0;font-size:18px;font-weight:800;}
  .field-label{display:block;margin-bottom:6px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:var(--stone-500);}
  .field-input{width:100%;border-radius:16px;border:1px solid var(--stone-200);background:#fff;padding:12px 16px;font-size:14px;font-weight:600;outline:none;transition:.15s;}
  .field-input:focus{border-color:var(--brand-400);box-shadow:0 0 0 4px var(--brand-100);}
  textarea.field-input{min-height:96px;resize:vertical;}
  .grid-2{display:grid;gap:16px;grid-template-columns:1fr;}
  @media(min-width:640px){.grid-2{grid-template-columns:1fr 1fr;}}
  .col-span-2{grid-column:1/-1;}
  .option-btn{border-radius:16px;border:2px solid var(--stone-200);padding:16px;text-align:start;transition:.15s;background:#fff;width:100%;}
  .option-btn:hover{border-color:var(--stone-300);}
  .option-btn.active{border-color:var(--brand-500);background:var(--brand-50);}
  .option-btn .opt-icon{font-size:22px;}
  .option-btn p{margin:4px 0 0;font-size:14px;font-weight:800;}
  .option-row{display:flex;align-items:center;gap:12px;border-radius:16px;border:2px solid var(--stone-200);padding:16px;transition:.15s;background:#fff;width:100%;text-align:start;}
  .option-row:hover{border-color:var(--stone-300);}
  .option-row.active{border-color:var(--brand-500);background:var(--brand-50);}
  .error-box{margin-top:16px;border-radius:16px;background:#fef2f2;padding:12px 16px;font-size:12px;font-weight:800;color:#dc2626;}
  .checkout-layout{margin-top:24px;display:grid;gap:24px;}
  @media(min-width:1024px){.checkout-layout{grid-template-columns:1.4fr 1fr;}}
  .checkout-cols{display:flex;flex-direction:column;gap:20px;}
  .summary-item{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0;}
  .summary-item .qty{font-weight:800;color:var(--coal-900);}

  /* order tracker */
  .tracker-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px;}
  .tracker-code-box{border-radius:16px;background:var(--stone-100);padding:12px 16px;text-align:center;}
  .tracker-code-box p:first-child{margin:0;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--stone-500);}
  .tracker-code-box p:last-child{margin:0;font-size:20px;font-weight:900;letter-spacing:.1em;color:var(--brand-600);}
  .steps-row{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:32px;}
  .step-col{display:flex;flex:1;flex-direction:column;align-items:center;}
  .step-line-wrap{display:flex;width:100%;align-items:center;}
  .step-line{height:4px;flex:1;border-radius:999px;background:var(--stone-200);}
  .step-line.done{background:var(--brand-500);}
  .step-line.none{background:transparent;}
  .step-dot{display:grid;place-items:center;height:40px;width:40px;flex-shrink:0;border-radius:999px;font-size:18px;background:var(--stone-100);color:var(--stone-400);transition:.2s;}
  .step-dot.done{background:var(--brand-500);color:#fff;box-shadow:0 10px 20px rgba(249,115,22,.3);}
  .step-label{margin-top:8px;text-align:center;font-size:10px;font-weight:800;color:var(--stone-400);}
  .step-label.done{color:var(--coal-900);}
  .info-grid{margin-top:32px;display:grid;gap:16px;grid-template-columns:1fr;}
  @media(min-width:640px){.info-grid{grid-template-columns:1fr 1fr;}}
  .info-box{border-radius:16px;background:var(--stone-50);padding:16px;}
  .info-box p:first-child{margin:0;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--stone-500);}
  .actions-row{margin-top:24px;display:flex;flex-wrap:wrap;gap:12px;}

/* =========================================================
   FORMAT HELPERS
========================================================= */
function formatPrice(cents){
  var value=cents/100;
  var nice=Number.isInteger(value)?String(value):value.toFixed(2).replace(".",",");
  return LANG==="ar"?(nice+" د.م."):(nice+" DH");
}
function formatOrderExactTime(iso){
  var d=new Date(iso);
  if(isNaN(d.getTime())) return "--:--:--";
  try{
    return new Intl.DateTimeFormat(LANG==="ar"?"ar-MA":"fr-MA",{
      hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false
    }).format(d);
  }catch(e){
    return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");
  }
}

function formatDateTime(iso){
  var d=new Date(iso);
  try{
    return new Intl.DateTimeFormat(LANG==="ar"?"ar-MA":"fr-MA",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).format(d);
  }catch(e){return d.toLocaleString();}
}
function orderCodeGen(){
  var chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",out="";
  for(var i=0;i<5;i++)out+=chars[Math.floor(Math.random()*chars.length)];
  return "LG-"+out;
}
function esc(s){
  if(s===undefined||s===null)return"";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* =========================================================

========================================================= */
function cartCount(){return CART.reduce(function(s,i){return s+i.quantity;},0);}
function cartSubtotal(){return CART.reduce(function(s,i){return s+i.quantity*i.price;},0);}
function findCartItem(id){for(var i=0;i<CART.length;i++)if(CART[i].id===id)return CART[i];return null;}
function addToCartById(id){var p=PRODUCTS.find(function(x){return x.id===id;});if(p)addToCart(p);}
function addToCart(product){
  var found=findCartItem(product.id);
  if(found){found.quantity+=1;}
  else{CART.push({id:product.id,nameFr:product.nameFr,nameAr:product.nameAr,price:product.price,quantity:1});}
  saveJSON("lg_cart_v1",CART);
  UI.cartOpen=true;
  render();
}
function setCartQty(id,qty){
  if(qty<=0){CART=CART.filter(function(i){return i.id!==id;});}
  else{var it=findCartItem(id);if(it)it.quantity=qty;}
  saveJSON("lg_cart_v1",CART);
  render();
}
function removeFromCart(id){CART=CART.filter(function(i){return i.id!==id;});saveJSON("lg_cart_v1",CART);render();}
function clearCart(){CART=[];saveJSON("lg_cart_v1",CART);render();}
function toggleCart(open){UI.cartOpen=open;render();}

function productMatchesFilter(p){
  var q=UI.query.trim().toLowerCase();
  var matchQuery=!q || p.nameFr.toLowerCase().indexOf(q)>=0 || p.nameAr.indexOf(q)>=0 || p.descFr.toLowerCase().indexOf(q)>=0 || p.descAr.indexOf(q)>=0;
  var cat=CATEGORIES.find(function(c){return c.id===p.categoryId;});
  var matchCat=UI.activeCat==="all" || (cat && cat.slug===UI.activeCat);
  return matchQuery && matchCat;
}
function menuCategoryPriority(cat){
  var order={
    "promotions":1,"top":2,"signature":3,"match-time":4,"offres":5,
    "grillades":6,"plats-marocains":7,"menu-jour":8,"mqilate":9,
    "salades":10,"supplements":11,"tacos":12,"pasticcio":13,
    "jus":14,"detox":15,"boissons":16
  };
  return order[cat.slug]||99;
}
function orderedMenuCategories(){
  return CATEGORIES.slice().sort(function(a,b){
    var pa=menuCategoryPriority(a),pb=menuCategoryPriority(b);
    if(pa!==pb)return pa-pb;
    return String(a.nameFr||"").localeCompare(String(b.nameFr||""));
  });
}

/* Upload image depuis téléphone/ordinateur.
   L'image est redimensionnée et compressée avant stockage local pour éviter de remplir
   trop vite le localStorage. */
function handleProductImageUpload(input){
  var file=input&&input.files&&input.files[0];
  if(!file||!UI.productForm)return;
  if(!file.type||file.type.indexOf("image/")!==0){alert(LANG==="ar"?"اختار صورة فقط.":"Choisis uniquement une image.");return;}
  var reader=new FileReader();
  reader.onload=function(e){
    var source=e.target.result;
    var img=new Image();
    img.onload=function(){
      var max=1200, scale=Math.min(1,max/Math.max(img.width,img.height));
      var w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
      var canvas=document.createElement("canvas"); canvas.width=w; canvas.height=h;
      var ctx=canvas.getContext("2d"); ctx.drawImage(img,0,0,w,h);
      var data=canvas.toDataURL("image/jpeg",0.82);
      updateProductFormField("image",data);
      updateImagePreview(data);
      var label=document.getElementById("productImageFileName");
      if(label)label.textContent=file.name;
    };
    img.onerror=function(){alert(LANG==="ar"?"تعذر قراءة الصورة.":"Impossible de lire cette image.");};
    img.src=source;
  };
  reader.readAsDataURL(file);
}

function downloadProductImage(){
  if(!UI.productForm||!UI.productForm.image)return;

function adminHourlyAnalytics(){
  // Analyse complète sur les 24 heures : 00:00 → 23:00
  var hours=[];
  for(var h=0;h<=23;h++) hours.push(h);

  var rows=hours.map(function(h){
    var count=0, revenue=0;
    ORDERS.forEach(function(o){
      if(o.status==="cancelled")return;
      var d=new Date(o.createdAt);
      if(d.getHours()===h){count++;revenue+=o.total;}
    });
    return {hour:h,count:count,revenue:revenue};
  });

  var validOrders=ORDERS.filter(function(o){return o.status!=="cancelled";});
  var totalOrders=validOrders.length;
  var totalRevenue=validOrders.reduce(function(sum,o){return sum+o.total;},0);
  var avg=totalOrders?Math.round(totalRevenue/totalOrders):0;
  var peak=rows.reduce(function(a,b){return b.revenue>a.revenue?b:a;},rows[0]);
  var max=Math.max.apply(null,rows.map(function(r){return r.revenue;}))||1;

  var html='<section class="analytics-card">'+
    '<div class="analytics-head"><div><h2 class="analytics-title">📊 '+t("analytics")+' · 00:00 → 23:59</h2>'+
    '<p class="analytics-sub">'+t("demoNote")+' · '+t("analyticsAllHours")+'</p></div>'+
    '<div class="analytics-actions"><button type="button" class="small-btn brand" onclick="window.print()">🖨️ '+t("exportPdf")+'</button></div></div>'+
    '<div class="analytics-grid">'+
      '<div class="analytics-mini"><div class="l">🧾 '+t("ordersCount")+'</div><div class="v">'+totalOrders+'</div></div>'+
      '<div class="analytics-mini"><div class="l">💰 '+t("revenue")+'</div><div class="v">'+formatPrice(totalRevenue)+'</div></div>'+
      '<div class="analytics-mini"><div class="l">🛒 '+t("avgOrder")+'</div><div class="v">'+formatPrice(avg)+'</div></div>'+
      '<div class="analytics-mini"><div class="l">🔥 '+t("peakHour")+'</div><div class="v">'+String(peak.hour).padStart(2,"0")+':00</div></div>'+
    '</div>'+
    '<div class="analytics-table-wrap"><table class="analytics-table"><thead><tr><th>'+t("hour")+'</th><th>'+t("ordersCount")+'</th><th>'+t("revenue")+'</th><th>'+t("revenue")+'</th></tr></thead><tbody>';

  rows.forEach(function(r){
    var pct=Math.round((r.revenue/max)*100);
    html+='<tr><td style="font-weight:900;">'+String(r.hour).padStart(2,"0")+':00</td>'+
      '<td>'+r.count+'</td><td style="font-weight:800;">'+formatPrice(r.revenue)+'</td>'+
      '<td><div class="analytics-bar"><span style="width:'+pct+'%;"></span></div></td></tr>';
  });
  html+='<tr class="analytics-total"><td>'+t("total")+'</td><td>'+totalOrders+'</td><td>'+formatPrice(totalRevenue)+'</td><td>100%</td></tr>';
  html+='</tbody></table></div>';

  // Tableau détaillé : qui a commandé, téléphone, heure exacte et contenu de la commande.
  html+='<div style="margin-top:22px;">'+
    '<h3 class="analytics-title" style="font-size:16px;">👤 '+t("orderDetailsAnalytics")+'</h3>'+
    '<div class="analytics-table-wrap"><table class="analytics-table" style="min-width:900px;"><thead><tr>'+
      '<th>'+t("hour")+'</th><th>'+t("customer")+'</th><th>'+t("phone")+'</th><th>'+t("orderItemsAnalytics")+'</th>'+
      '<th>'+t("amount")+'</th><th>'+t("status")+'</th>'+
    '</tr></thead><tbody>';

  var detailOrders=ORDERS.slice().sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt);});
  if(detailOrders.length===0){
    html+='<tr><td colspan="6" style="text-align:center;padding:24px;">'+t("noOrders")+'</td></tr>';
  }else{
    detailOrders.forEach(function(o){
      var d=new Date(o.createdAt);
      var exactTime=String(d.getHours()).padStart(2,"0")+':'+String(d.getMinutes()).padStart(2,"0")+':'+String(d.getSeconds()).padStart(2,"0");
      var itemsText=o.items.map(function(item){
        return item.quantity+'× '+esc(pick(item.nameFr,item.nameAr));
      }).join(' · ');
      var statusLabel=t("status_"+o.status);
      html+='<tr>'+
        '<td style="font-weight:900;white-space:nowrap;">'+exactTime+'</td>'+
        '<td style="font-weight:800;">'+esc(o.customerName||"-")+'</td>'+
        '<td dir="ltr" style="white-space:nowrap;">'+esc(o.phone||"-")+'</td>'+
        '<td style="min-width:280px;">'+itemsText+'</td>'+
        '<td style="font-weight:800;white-space:nowrap;">'+formatPrice(o.total)+'</td>'+
        '<td><span class="status-chip st-'+esc(o.status)+'">'+esc(statusLabel)+'</span></td>'+
      '</tr>';
    });
  }
  html+='</tbody></table></div></div></section>';
  return html;
}

function buildBackupPayload(){
  return {
    version:1,
    exportedAt:new Date().toISOString(),
    restaurant:RESTAURANT,
    categories:CATEGORIES,
    products:PRODUCTS,
    orders:ORDERS,
    cart:CART,
    lang:LANG
  };
}
function exportBackup(){
  saveAllData();
  var blob=new Blob([JSON.stringify(buildBackupPayload(),null,2)],{type:"application/json;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  a.download="grillade-le-gout-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
function importBackupFile(input){
  var file=input&&input.files&&input.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(reader.result);
      if(!data||!Array.isArray(data.products)||!Array.isArray(data.categories)||!Array.isArray(data.orders)){
        throw new Error("Format de sauvegarde invalide");
      }
      if(!confirm(LANG==="ar"?"واش بغيتي تعوض البيانات الحالية بالنسخة الاحتياطية؟":"Remplacer les données actuelles par cette sauvegarde ?"))return;
      CATEGORIES=data.categories;
      PRODUCTS=data.products;
      ORDERS=data.orders;
      CART=Array.isArray(data.cart)?data.cart:[];
      if(data.restaurant&&typeof data.restaurant==="object"){
        Object.keys(RESTAURANT).forEach(function(k){
          if(Object.prototype.hasOwnProperty.call(data.restaurant,k))RESTAURANT[k]=data.restaurant[k];
        });
      }
      if(data.lang==="fr"||data.lang==="ar")LANG=data.lang;
      saveAllData();
      alert(LANG==="ar"?"ترجعات البيانات بنجاح.":"Données restaurées avec succès.");
      render();
    }catch(e){
      alert(LANG==="ar"?"النسخة الاحتياطية غير صالحة.":"Fichier de sauvegarde invalide.");
    }finally{
      input.value="";
    }
  };
  reader.readAsText(file);
}

  saveAllData();
  alert(t("backupDone")+" "+t("backupWarning"));
}

function route(){
  var hash=location.hash||"#/";
  var app=document.getElementById("app");
  var html;
  if(hash==="#/"||hash===""){
    html=pageHome();
  }else if(hash==="#/menu"){
    html=pageHome();
  }else if(hash==="#/checkout"){
    html=pageCheckout();
  }else if(hash.indexOf("#/commande/")===0){
    html=pageOrder(hash.replace("#/commande/",""));
  }else if(hash==="#/suivi"){
    html=pageTrack();
  }else if(hash==="#/admin"){
    html=pageAdmin();
  }else{
    html=pageHome();
  }
  app.innerHTML=html;
  window.scrollTo(0,0);
}
function render(){route();}

document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
window.addEventListener("hashchange",route);
window.addEventListener("beforeunload",function(){try{saveAllData();}catch(e){}});
route();

function lgStoragePathFromUrl(url){
  var marker="/storage/v1/object/public/"+LG_SUPABASE_BUCKET+"/";
  var i=String(url||"").indexOf(marker);return i>=0?String(url).slice(i+marker.length).split("?")[0]:"";
}
async function lgUploadImage(blob,filename){
  if(!supabaseClient||!LG_SESSION)throw new Error("Admin non connecté");
  var path="products/"+Date.now()+"-"+Math.random().toString(36).slice(2,9)+"-"+String(filename||"image.jpg").replace(/[^a-zA-Z0-9._-]/g,"-");
  var r=await supabaseClient.storage.from(LG_SUPABASE_BUCKET).upload(path,blob,{contentType:blob.type||"image/jpeg",upsert:false});
  if(r.error)throw r.error;
  return supabaseClient.storage.from(LG_SUPABASE_BUCKET).getPublicUrl(path).data.publicUrl;
}
async function lgDeleteImageUrl(url){
  if(!supabaseClient||!LG_SESSION)return;
  var path=lgStoragePathFromUrl(url);if(!path)return;
  try{await supabaseClient.storage.from(LG_SUPABASE_BUCKET).remove([path]);}catch(e){}
}
function handleProductImageUpload(input){

  var reader=new FileReader();
  reader.onload=function(e){var img=new Image();img.onload=function(){
    var max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
    var canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;var ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,w,h);
    canvas.toBlob(function(blob){UI.productForm._imageBlob=blob;UI.productForm._imageName=file.name;UI.productForm.image=URL.createObjectURL(blob);updateImagePreview(UI.productForm.image);var l=document.getElementById("productImageFileName");if(l)l.textContent=file.name;},"image/jpeg",0.82);
  };img.onerror=function(){lgToast(LANG==="ar"?"تعذر قراءة الصورة.":"Impossible de lire cette image.");};img.src=e.target.result;};reader.readAsDataURL(file);
}

/* ---------- Migration of existing local catalogue ---------- */
async function syncLocalCatalogToCloud(){
  if(!LG_SESSION){lgToast("Connecte-toi à l'Admin d'abord.");return;}
  if(!confirm("Importer le catalogue actuellement présent dans ce navigateur vers Supabase ?"))return;
  try{
    var cats=CATEGORIES.map(function(c,i){return {id:Number(c.id),slug:c.slug||("cat-"+c.id),name_fr:c.nameFr,name_ar:c.nameAr,emoji:c.emoji||"🍽️",sort_order:c.sort_order||i+1,active:c.active!==false};});
    var cr=await supabaseClient.from("categories").upsert(cats,{onConflict:"id"});if(cr.error)throw cr.error;
    var ps=PRODUCTS.map(function(p,i){return {id:Number(p.id),category_id:Number(p.categoryId),name_fr:p.nameFr,name_ar:p.nameAr,desc_fr:p.descFr||"",desc_ar:p.descAr||"",price_cents:Number(p.price)||0,cost_cents:Number(p.cost)||0,available:p.available!==false,popular:!!p.popular,image_url:(p.image&&String(p.image).indexOf("data:image/")!==0)?p.image:null,sort_order:p.sort_order||i+1,active:p.active!==false};});
    var pr=await supabaseClient.from("products").upsert(ps,{onConflict:"id"});if(pr.error)throw pr.error;
    var sr=await supabaseClient.rpc("admin_sync_sequences");if(sr.error)throw sr.error;
    await lgLoadAdminData();render();lgToast("Catalogue synchronisé vers Supabase.");
  }catch(e){lgToast((e.message||e)+"\nVérifie que le SQL a été exécuté dans Supabase.");}
}

/* ---------- Cloud orders ---------- */
async function submitOrder(){
  var s=UI.checkout;s.error="";
  if(!s.name.trim()||!s.phone.trim()||(s.mode==="delivery"&&!s.address.trim())){s.error=t("requiredFields");render();return;}
  var subtotal=cartSubtotal();if(subtotal<MIN_ORDER){s.error=t("minOrderError");render();return;}
  var deliveryFee=checkoutDeliveryFee();var code;do{code=orderCodeGen();}while(ORDERS.some(function(o){return o.code===code;}));
  var items=CART.map(function(i){return {product_id:Number(i.id),quantity:Number(i.quantity)};});
  var localItems=CART.map(function(i){return {id:i.id,nameFr:i.nameFr,nameAr:i.nameAr,unitPrice:i.price,unitCost:i.cost||0,quantity:i.quantity,lineTotal:i.price*i.quantity};});
  var orderBase={order_code:code,customer_name:s.name.trim(),phone:s.phone.trim(),zone:s.mode==="delivery"?s.zone:"",address:s.mode==="delivery"?s.address.trim():"",notes:s.notes||"",payment_method:s.payment,delivery_mode:s.mode,delivery_fee_cents:deliveryFee};
  try{
    if(LG_CLOUD_READY&&supabaseClient){
      var r=await supabaseClient.rpc("create_order",{p_order:orderBase,p_items:items});if(r.error)throw r.error;
      var cloud=r.data;var orderId=cloud&&cloud.id?cloud.id:(typeof cloud==="string"?cloud:null);
      ORDERS.unshift({id:orderId||code,code:code,customerName:s.name,phone:s.phone,zone:orderBase.zone,address:orderBase.address,notes:s.notes,paymentMethod:s.payment,deliveryMode:s.mode,subtotal:cloud&&cloud.subtotal_cents||subtotal,deliveryFee:deliveryFee,total:cloud&&cloud.total_cents||subtotal+deliveryFee,status:"pending",createdAt:cloud&&cloud.created_at||lgNowIso(),items:localItems});
    }else{
      var nextId=ORDERS.reduce(function(m,o){return Math.max(m,Number(o.id)||0);},0)+1;ORDERS.push({id:nextId,code:code,customerName:s.name,phone:s.phone,zone:orderBase.zone,address:orderBase.address,notes:s.notes,paymentMethod:s.payment,deliveryMode:s.mode,subtotal:subtotal,deliveryFee:deliveryFee,total:subtotal+deliveryFee,status:"pending",createdAt:lgNowIso(),items:localItems});saveJSON("lg_orders_v1",ORDERS);
    }
    clearCart();UI.checkout={name:"",phone:"",zone:ZONES[0].value,address:"",notes:"",payment:"cash",mode:"delivery",error:"",loading:false};location.hash="#/commande/"+code;
  }catch(e){s.error=(LANG==="ar"?"تعذر تسجيل الطلب online: ":"Impossible d'enregistrer la commande en ligne : ")+(e.message||e);render();}
}

/* ---------- Analytics ---------- */
function lgDateRange(){
  var now=new Date();var start=new Date(now);start.setHours(0,0,0,0);var end=new Date(now);end.setHours(23,59,59,999);
  if(LG_ANALYTICS_FILTER.preset==="7d"){start.setDate(start.getDate()-6);}
  else if(LG_ANALYTICS_FILTER.preset==="month"){start=new Date(now.getFullYear(),now.getMonth(),1);}
  else if(LG_ANALYTICS_FILTER.preset==="custom"){if(LG_ANALYTICS_FILTER.from){start=new Date(LG_ANALYTICS_FILTER.from+"T00:00:00");}if(LG_ANALYTICS_FILTER.to){end=new Date(LG_ANALYTICS_FILTER.to+"T23:59:59");}}
  return {start:start,end:end};
}
function lgFilteredOrders(){var r=lgDateRange();return ORDERS.filter(function(o){var d=new Date(o.createdAt);return o.status!=="cancelled"&&d>=r.start&&d<=r.end;});}

  var cats=Object.keys(catMap).map(function(k){return catMap[k];}).sort(function(a,b){return b.revenue-a.revenue;});
  var maxH=Math.max.apply(null,hours.map(function(x){return x.revenue;}))||1;
  var html='<section class="analytics-card"><div class="analytics-head"><div><h2 class="analytics-title">📊 Analyse des ventes</h2><p class="analytics-sub">Données online Supabase · '+lgDateRange().start.toLocaleDateString()+" → "+lgDateRange().end.toLocaleDateString()+'</p></div><div class="analytics-actions"><button class="small-btn '+(LG_ANALYTICS_FILTER.preset==="today"?"brand":"")+'" onclick="setAnalyticsPreset(&quot;today&quot;)">Aujourd&apos;hui</button><button class="small-btn '+(LG_ANALYTICS_FILTER.preset==="7d"?"brand":"")+'" onclick="setAnalyticsPreset(&quot;7d&quot;)">7 jours</button><button class="small-btn '+(LG_ANALYTICS_FILTER.preset==="month"?"brand":"")+'" onclick="setAnalyticsPreset(&quot;month&quot;)">Mois</button></div></div>'+
  '<div class="analytics-grid"><div class="analytics-mini"><div class="l">💰 CA</div><div class="v">'+lgMoney(revenue)+'</div></div><div class="analytics-mini"><div class="l">🧾 Commandes</div><div class="v">'+orders.length+'</div></div><div class="analytics-mini"><div class="l">🛒 Panier moyen</div><div class="v">'+lgMoney(avg)+'</div></div><div class="analytics-mini"><div class="l">🍽️ Quantités</div><div class="v">'+qty+'</div></div><div class="analytics-mini"><div class="l">📦 Coût matière</div><div class="v">'+lgMoney(cost)+'</div></div><div class="analytics-mini"><div class="l">📈 Marge brute</div><div class="v">'+lgMoney(gross)+'</div></div><div class="analytics-mini"><div class="l">💸 Dépenses</div><div class="v">'+lgMoney(expenses)+'</div></div><div class="analytics-mini"><div class="l">📊 Résultat estimé</div><div class="v">'+lgMoney(net)+'</div></div></div>'+
  '<div class="analytics-table-wrap"><table class="analytics-table"><thead><tr><th>Heure</th><th>Commandes</th><th>CA</th><th></th></tr></thead><tbody>'+hours.map(function(x){return '<tr><td>'+String(x.h).padStart(2,"0")+':00</td><td>'+x.orders+'</td><td>'+lgMoney(x.revenue)+'</td><td><div class="analytics-bar"><span style="width:'+Math.round(x.revenue/maxH*100)+'%"></span></div></td></tr>';}).join("")+'<tr class="analytics-total"><td>Heure forte</td><td>'+peak.orders+'</td><td>'+lgMoney(peak.revenue)+'</td><td>'+String(peak.h).padStart(2,"0")+':00</td></tr></tbody></table></div>'+

  return html;
}

  return '<article class="product-card '+(p.available?"":"unavailable")+'"><div class="product-image '+(p.image?"has-photo":"")+'">'+photo+'</div><div class="product-info"><div class="product-main"><div class="product-top"><h3 class="product-name">'+esc(pick(p.nameFr,p.nameAr))+'</h3>'+(p.popular?'<span class="popular-tag">★ '+t("popular")+'</span>':'')+'</div>'+(pick(p.descFr,p.descAr)?'<p class="product-desc">'+esc(pick(p.descFr,p.descAr))+'</p>':'')+'</div><div class="product-bottom"><span class="product-price">'+formatPrice(p.price)+'</span>'+actionHtml+'</div></div></article>';
}
